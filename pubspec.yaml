name: flutter_application_1
description: "MOS - Maintenance Online System, Fuel Terminal Maos"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  image: ^4.5.4
  image_picker: ^1.2.2
  flutter_secure_storage: ^9.2.4
  local_auth: ^2.3.0
  pdf: ^3.12.0
  printing: ^5.14.3
  url_launcher: ^6.3.2
  archive: ^4.5.2
  share_plus: ^10.1.4
  flutter_local_notifications: ^19.4.0
  workmanager: ^0.9.0
  mobile_scanner: ^6.0.2
  file_picker: ^8.1.4
  video_compress: ^3.1.4

dependency_overrides:
  archive: ^4.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#0B2A4A"
  adaptive_icon_foreground: "assets/icon.png"
  web:
    generate: true
    image_path: "assets/icon.png"
    background_color: "#0B2A4A"
    theme_color: "#0B2A4A"
  windows:
    generate: true
    image_path: "assets/icon.png"
    icon_size: 256

flutter_native_splash:
  color: "#0B2A4A"
  image: assets/icon.png
  android_12:
    color: "#0B2A4A"
    image: assets/icon.png

flutter:
  uses-material-design: true
  assets:
    - assets/icon.png
    - assets/splash.png
    - assets/logo_dcm.png
    - assets/logo_pertamina.png